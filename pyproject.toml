[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "plekton"
version = "0.1.0"
description = "Fast synthetic graph generation and sparsification in Rust, with Python bindings."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ilias Laoukili" }]
requires-python = ">=3.11"
# The base package stays lean: `import plekton` pulls only numpy. Everything
# heavier (torch, torch_geometric, networkx, polars) is an opt-in extra.
dependencies = [
    "numpy>=1.24",
]
keywords = [
    "graph",
    "network-science",
    "synthetic-graphs",
    "simulation",
    "sbm",
    "csbm",
    "sparsification",
    "gnn",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ilias-laoukili/plekton"
Repository = "https://github.com/ilias-laoukili/plekton"
Issues = "https://github.com/ilias-laoukili/plekton/issues"

[project.optional-dependencies]
pyg = [
    "torch>=2.0",
    "torch_geometric>=2.4",
]
networkx = [
    "networkx>=3.0",
]
bench = [
    "plekton[networkx]",
]
all = [
    "plekton[pyg,networkx]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "maturin>=1.7,<2.0",
]

[tool.maturin]
manifest-path = "crates/plekton-python/Cargo.toml"
module-name = "plekton._plekton"
# Install python/plekton/ alongside the compiled .so.
python-source = "python"
features = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"python/plekton/*" = ["RUF001", "RUF002", "RUF003"]
"python/plekton/*.pyi" = ["E501", "FBT001", "FBT002", "PLR0913", "PYI021", "RUF001", "RUF002", "RUF003"]
"python/tests/*" = ["E402", "INP001", "S101", "RUF001", "RUF002", "RUF003", "PLR2004"]
"benchmarks/bench.py" = ["INP001", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "requires_pyg: needs torch + torch_geometric (skipped when absent)",
]

[tool.mypy]
python_version = "3.11"
files = ["python/plekton"]
ignore_missing_imports = true
strict = true
