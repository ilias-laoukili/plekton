[package]
name        = "plekton-sparsify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Principled graph edge-sparsification strategies: approximate effective resistance (Spielman–Srivastava), metric backbone, threshold, degree-aware, and weighted sampling."
license.workspace = true
keywords    = ["graph", "sparsification", "spectral", "gnn", "backbone"]
categories  = ["algorithms", "science"]
readme      = "README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
plekton-metrics = { path = "../plekton-metrics", version = "0.1.0" }
rand             = "0.8"
rand_chacha      = "0.3"
rand_distr       = "0.4"
rayon            = "1"
thiserror        = { workspace = true }

[lints]
workspace = true
