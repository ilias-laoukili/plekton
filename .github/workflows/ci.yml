name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude plekton-python --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --exclude plekton-python
      - name: Doctests
        run: cargo test --doc --workspace --exclude plekton-python

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy pytest ruff mypy networkx
      - name: Build and install Python wheel
        run: |
          maturin build --release --out target/wheels
          pip install --no-deps --force-reinstall target/wheels/plekton-*.whl
      - name: Verify lean base import
        run: python -c "import plekton; print(plekton.__all__)"
      - name: Lint & typecheck
        run: |
          ruff check python benchmarks
          mypy
      - name: Run pytest
        run: pytest -v
